name: Release npm

# Publishes when a version tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1+, staged publishing 11.15+, and npm 11.5.x
      # skips rolldown's native binding on a clean install. 11.21 and later handle all three.
      - run: npm install -g npm@11
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Records only whether a bootstrap token exists; the token itself reaches the publish step alone.
      - name: Choose publish method
        id: auth
        run: echo "bootstrap=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # Normal path: npm trusted publishing (OIDC). No token is stored anywhere.
      - name: Publish (trusted publishing)
        if: steps.auth.outputs.bootstrap != 'true'
        run: npm publish --access public
      # Bootstrap path for the very first version only: npm cannot configure a trusted
      # publisher until the package exists. Add a stage-only granular token as the
      # NPM_TOKEN secret of the "npm" environment. The workflow stages the version and
      # a maintainer approves it on npmjs.com with 2FA. Delete the secret afterwards.
      - name: Stage for approval (bootstrap token)
        if: steps.auth.outputs.bootstrap == 'true'
        run: |
          npm stage publish --access public --provenance
          {
            echo "### Staged ${GITHUB_REF_NAME} for approval"
            echo "Approve it on npmjs.com under Staged Packages (2FA required), or run \`npm stage approve <id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
