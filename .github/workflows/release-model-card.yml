name: Release model card

# Uploads only model cards when they change, leaving the weight files (and
# every browser cache keyed by their hashes) untouched.
on:
  push:
    branches: [main]
    paths: ["tools/models/*/hub/README.md"]
  workflow_dispatch:
    inputs:
      model:
        description: Model whose card to upload
        type: choice
        options: [timesfm]
        default: timesfm

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: huggingface
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tags after v6
      - name: Upload changed cards
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CARD_COMMIT_MESSAGE: "Update model card from ${{ github.repository }}@${{ github.sha }}"
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            models="${{ inputs.model }}"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            models=$(ls tools/models)
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            models=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'tools/models/*/hub/README.md' | cut -d/ -f3 | sort -u)
          else
            # The previous head is gone (force-push): upload every card rather than fail.
            models=$(ls tools/models)
          fi
          for m in $models; do
            uv run --no-project --with huggingface_hub python tools/upload_card.py "$m"
          done
